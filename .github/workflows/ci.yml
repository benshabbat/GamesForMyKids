name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run CI on'
        required: false
        default: ''

jobs:
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gamesformykids

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gamesformykids/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      # --coverage so the thresholds in vitest.config.ts are enforced; without
      # it they're inert and a deleted test costs nothing.
      - name: Test
        run: npm test -- --run --coverage --reporter=verbose

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gamesformykids

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gamesformykids/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build (with bundle analysis)
        run: ANALYZE=true npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      # The gate. Without this the job only ever produced an artifact somebody
      # had to remember to open, so a change that doubled a route's JS passed
      # CI green. Budgets live in gamesformykids/bundle-budget.json.
      - name: Check first-load JS budgets
        run: node scripts/check-bundle-size.mjs

      - name: Upload bundle report
        # Runs even when the budget check fails — that's exactly when someone
        # needs the analyzer output to find out what grew.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: gamesformykids/.next/analyze/
          retention-days: 30
